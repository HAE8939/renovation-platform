services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: renovation-platform:internal
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: file:/app/prisma-data/dev.db
    volumes:
      - renovation_db:/app/prisma-data
      - renovation_uploads:/app/public/uploads
      - renovation_logs:/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/notifications').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  renovation_db:
  renovation_uploads:
  renovation_logs:
